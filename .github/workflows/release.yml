name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          # @semantic-release/git pushes a chore(release) commit that bumps
          # mix.exs `@version`. The push needs the actions token persisted.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "lts/*"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: .github/semantic-release/package.json

      - name: Install semantic-release toolchain
        run: |
          pnpm install --frozen-lockfile --dir .github/semantic-release --ignore-scripts
          echo "$PWD/.github/semantic-release/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Get latest release before
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "none")
          echo "tag=$BEFORE_TAG" >> $GITHUB_OUTPUT
          echo "Latest release before: $BEFORE_TAG"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Invoked directly, not via npx: npx ignores the PATH entry above and
        # fetches its own unpinned copy, without the plugins.
        run: semantic-release

      - name: Check for new release
        id: semantic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AFTER_TAG=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "none")
          BEFORE_TAG="${{ steps.before.outputs.tag }}"

          if [[ "$BEFORE_TAG" != "$AFTER_TAG" && "$AFTER_TAG" != "none" ]]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=$AFTER_TAG" >> $GITHUB_OUTPUT
            echo "New release published: $AFTER_TAG"
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "No new release published"
          fi

  trigger-docker:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Docker Image Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker.yml \
            --repo ${{ github.repository }} \
            --ref refs/tags/${{ needs.release.outputs.new_release_version }}

  trigger-helm:
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Helm Chart Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run helm-publish.yml \
            --repo ${{ github.repository }} \
            --ref refs/tags/${{ needs.release.outputs.new_release_version }}
